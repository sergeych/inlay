name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libnss3 libasound2t64 libxcb-cursor0 fonts-dejavu-core
      - run: python -m pip install -e ./app pytest build
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      - run: python tools/sync_skill.py --check
      - run: python tools/build_skill.py
      - run: python -m build app --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: inlay-distributions
          path: dist/*
